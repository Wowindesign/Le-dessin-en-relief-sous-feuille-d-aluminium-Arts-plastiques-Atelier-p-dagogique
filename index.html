<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Dessin en relief — Soran Ahmed</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#020b19;color:#f3e5c8;font-family:Arial,Helvetica,sans-serif;overflow:hidden}.app{height:100dvh;display:flex;flex-direction:column}.stage{width:100vw;height:calc(100dvh - 68px);margin:0;display:grid;grid-template-columns:59% 41%;background:#071a35;overflow:hidden;box-shadow:none}.textside{grid-column:2;grid-row:1;background:#091c3b;padding:clamp(14px,2.8vw,45px);display:flex;flex-direction:column;justify-content:center;min-width:0;overflow:hidden}.eyebrow{font-size:clamp(10px,1.1vw,16px);color:#d9bd81;letter-spacing:.12em;text-transform:uppercase;margin-bottom:15px}.textside h1{font-size:clamp(19px,2.35vw,39px);line-height:1.13;color:#f6dcaa;margin:0 0 18px}.textside p{font-size:clamp(13px,1.33vw,21px);line-height:1.48;margin:0;overflow:auto;max-height:55%;scrollbar-width:none}.credit{font-size:clamp(11px,.95vw,15px);color:#cdbb9a;margin-top:24px}.imagearea{grid-column:1;grid-row:1;background:#102746;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}.imagearea img{width:100%;height:100%;object-fit:contain;animation:fade .65s ease}.imagearea .stamp{position:absolute;bottom:12px;right:15px;background:#03101dcc;color:#f9e8c7;padding:7px 12px;border-radius:6px;font-size:clamp(11px,.95vw,15px)}@keyframes fade{from{opacity:.15;transform:scale(1.012)}to{opacity:1;transform:scale(1)}}.materials{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;height:100%;padding:15px}.material{min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#102746;border:0;border-radius:0;padding:5px}.material img{height:74%;width:100%;object-fit:contain}.material span{font-size:clamp(9px,.85vw,13px);text-align:center}.controls{height:68px;flex-shrink:0;display:flex;align-items:center;justify-content:center;gap:8px;background:#080f20;flex-wrap:wrap;padding:6px}button,select{background:#183b62;border:1px solid #6e839d;color:#fff0d0;padding:9px 12px;border-radius:6px;cursor:pointer;font-size:13px}button:hover{background:#28527b}.counter{min-width:78px;text-align:center;color:#ebd3a8;font-size:13px}@media(max-width:700px){.stage{width:100%;height:calc(100dvh - 86px);grid-template-columns:57% 43%}.textside{grid-column:2;grid-row:1;background:#091c3b;padding:12px}.textside p{font-size:12px}.controls{height:86px;gap:4px}button{font-size:11px;padding:7px}.imagearea .stamp{font-size:10px}}
@keyframes pageTurn{from{opacity:.2;transform:perspective(1300px) rotateY(-9deg) translateX(12px);transform-origin:right center}to{opacity:1;transform:perspective(1300px) rotateY(0) translateX(0)}}
.stage.turning{animation:pageTurn .72s ease both}.imagearea img{animation:pageTurn .72s ease both}.textside h1,.textside p{animation:fade .65s ease both}.controls{background:#080f20}button{border-radius:24px;background:#16233d;border-color:#e5bb8544;color:#f3ddba}button:hover{background:#27446a}
@media(prefers-reduced-motion:reduce){.stage.turning,.imagearea img,.textside h1,.textside p{animation:none}}
</style></head><body><div class="app"><main class="stage"><section class="textside"><div class="eyebrow">Arts plastiques · Atelier pédagogique</div><h1 id="title"></h1><p id="body"></p><div class="credit" id="credit"></div></section><section class="imagearea" id="imagearea"></section></main><footer class="controls"><button id="prev">◀ Précédent</button><button id="play">▶ Lecture</button><button id="next">Suivant ▶</button><button id="toc">Sommaire</button><button id="sound">Son des pages : oui</button><button id="voice">🔊 Voix FR : oui</button><label>Durée image <select id="speed"><option value="5000">5 s</option><option value="7000" selected>7 s</option><option value="10000">10 s</option></select></label><button id="full">⛶ Plein écran</button><span class="counter" id="counter"></span></footer></div><aside id="overview" style="display:none;position:fixed;inset:0;background:#091226fa;z-index:40;overflow:auto;padding:24px;color:#f3e5c8"><button id="close">Fermer ×</button><h2>Sommaire des diapositives</h2><div id="overviewItems" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-top:18px"></div></aside><script>
const slides=[{"type": "intro", "title": "Le dessin en relief sous feuille d’aluminium", "body": "Une activité de création artistique qui permet de transformer un simple carton en une œuvre texturée et brillante. Conception pédagogique : Soran Ahmed."}, {"type": "materials", "title": "Le matériel nécessaire", "body": "Préparez un carton, une feuille d’aluminium dorée ou argentée, une colle épaisse pour tracer les reliefs, une colle liquide pour fixer la feuille et des cotons-tiges pour faire apparaître les détails."}, {"type": "step", "title": "1. Préparer le support", "body": "Choisissez un morceau de carton de la taille souhaitée. Un carton de récupération convient parfaitement."}, {"type": "step", "title": "2. Dessiner la composition", "body": "Avec un crayon, esquissez sur le carton le motif que vous souhaitez réaliser."}, {"type": "step", "title": "3. Créer les lignes en relief", "body": "Suivez les contours du dessin avec de la colle épaisse, en formant des lignes régulières et continues."}, {"type": "step", "title": "4. Laisser sécher", "body": "Laissez sécher complètement les lignes de colle. Il est préférable de poursuivre le travail le lendemain."}, {"type": "step", "title": "5. Choisir la feuille métallique", "body": "Préparez une feuille d’aluminium dorée, si vous en disposez, ou une feuille argentée ordinaire."}, {"type": "step", "title": "6. Appliquer la colle", "body": "Recouvrez soigneusement toute la surface du carton avec de la colle liquide, sans laisser de zones sèches."}, {"type": "step", "title": "7. Poser la feuille", "body": "Déposez délicatement la feuille d’aluminium sur le carton encollé, puis faites-la adhérer progressivement."}, {"type": "step", "title": "8. Révéler les reliefs", "body": "À l’aide d’un coton-tige, appuyez doucement autour des lignes en relief pour révéler le dessin sans déchirer la feuille. L’œuvre peut ensuite être encadrée et exposée."}, {"type": "end", "title": "À vous de créer !", "body": "Expérimentez les formes, les textures et les effets de lumière. Deux vidéos de démonstration peuvent être ajoutées à cette page pour accompagner l’atelier. Conception pédagogique : Soran Ahmed · www.wowindesign.com"}];const materials=[{"img": "material_1.jpg", "name": "Carton ondulé"}, {"img": "material_2.jpg", "name": "Feuille aluminium dorée"}, {"img": "material_3.jpg", "name": "Feuille aluminium argentée"}, {"img": "material_4.jpg", "name": "Colle épaisse (Tacky Glue)"}, {"img": "material_5.jpg", "name": "Colle liquide"}, {"img": "material_6.jpg", "name": "Coton-tige"}];
const artworks=['oeuvre_1.jpg','oeuvre_2.jpg','oeuvre_3.jpg','oeuvre_4.jpg','oeuvre_5.jpg','oeuvre_6_assa_ahmed.jpg'];
let index=0,artIndex=0,playing=false,voice=true,artTimer=null,speechToken=0,slideTimer=null,pageSound=true,audioContext=null;
const $=id=>document.getElementById(id);function cancelSpeech(){speechToken++;if('speechSynthesis'in window)speechSynthesis.cancel();clearTimeout(slideTimer)}
function drawArt(){const area=$('imagearea');if(index===1){area.innerHTML='';const grid=document.createElement('div');grid.className='materials';materials.forEach(m=>{let d=document.createElement('div');d.className='material';let im=document.createElement('img');im.src=m.img;im.alt=m.name;let t=document.createElement('span');t.textContent=m.name;d.append(im,t);grid.append(d)});area.append(grid);return}
const src=artworks[artIndex%artworks.length];area.innerHTML='';let im=document.createElement('img');im.src=src;im.alt='Exemple de dessin en relief';let credit=document.createElement('div');credit.className='stamp';credit.textContent=artIndex%6===5?'Œuvre : Assa Ahmed':'Œuvre : Soran Ahmed';area.append(im,credit)}
function rustle(){if(!pageSound)return;try{audioContext??=new(window.AudioContext||window.webkitAudioContext)();audioContext.resume();let len=Math.floor(audioContext.sampleRate*.3),buffer=audioContext.createBuffer(1,len,audioContext.sampleRate),samples=buffer.getChannelData(0);for(let i=0;i<len;i++)samples[i]=(Math.random()*2-1)*Math.sin(Math.PI*i/len)*.045;let source=audioContext.createBufferSource(),filter=audioContext.createBiquadFilter();filter.type='highpass';filter.frequency.value=950;source.buffer=buffer;source.connect(filter);filter.connect(audioContext.destination);source.start()}catch(e){}}
function pageMotion(){let el=document.querySelector('.stage');el.classList.remove('turning');void el.offsetWidth;el.classList.add('turning');rustle()}
function artLoop(){clearInterval(artTimer);if(!playing)return;artTimer=setInterval(()=>{artIndex=(artIndex+1)%6;drawArt();rustle()},Number($('speed').value))}
function render(){cancelSpeech();let s=slides[index];$('title').textContent=s.title;$('body').textContent=s.body;$('credit').textContent='Conception pédagogique : Soran Ahmed · www.wowindesign.com';$('counter').textContent=(index+1)+' / '+slides.length;drawArt();artLoop();if(playing)readOrAdvance()}
function readOrAdvance(){const t=speechToken,s=slides[index];if(voice&&'speechSynthesis'in window){let u=new SpeechSynthesisUtterance(s.title+'. '+s.body);u.lang='fr-FR';u.rate=.91;let v=speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().startsWith('fr'));if(v)u.voice=v;u.onend=()=>{if(playing&&speechToken===t)slideTimer=setTimeout(next,1100)};u.onerror=()=>{if(playing&&speechToken===t)slideTimer=setTimeout(next,9000)};speechSynthesis.speak(u)}else{slideTimer=setTimeout(()=>{if(playing&&speechToken===t)next()},Math.max(9500,s.body.length*55))}}
function next(){index=(index+1)%slides.length;pageMotion();render()}$('next').onclick=next;$('prev').onclick=()=>{index=(index-1+slides.length)%slides.length;pageMotion();render()};$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'Ⅱ Pause':'▶ Lecture';clearInterval(artTimer);render()};$('voice').onclick=()=>{voice=!voice;$('voice').textContent='🔊 Voix FR : '+(voice?'oui':'non');render()};$('sound').onclick=()=>{pageSound=!pageSound;$('sound').textContent='Son des pages : '+(pageSound?'oui':'non');if(pageSound)rustle()};
$('toc').onclick=()=>{playing=false;clearInterval(artTimer);cancelSpeech();$('play').textContent='▶ Lecture';$('overview').style.display='block'};
$('close').onclick=()=>$('overview').style.display='none';
$('overviewItems').innerHTML=slides.map((slide,i)=>'<button style="text-align:left;border-radius:8px;min-height:65px">'+(i+1)+'. '+slide.title+'</button>').join('');
[...$('overviewItems').children].forEach((b,i)=>b.onclick=()=>{index=i;$('overview').style.display='none';pageMotion();render()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('overview').style.display='none';if(e.key==='ArrowRight'){next()}if(e.key==='ArrowLeft'){$('prev').click()}});
$('speed').onchange=artLoop;$('full').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen();else document.exitFullscreen()};render();
</script></body></html>
